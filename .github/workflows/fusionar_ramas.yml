name: 🚀 Compilador Winlator Ludashi 3.1 Original

on:
  workflow_dispatch: # Activa el botón manual "Run workflow" en la pestaña Actions

jobs:
  build-ludashi-31:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente de la Rama ludashi-3.1
        uses: actions/checkout@v4
        with:
          ref: 'ludashi-3.1'       # Descarga la rama 3.1 original
          submodules: 'recursive' # Inicializa y clona todos los submódulos de fábrica automáticamente

      - name: 2. Configurar Entorno de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Aceptar Licencias de Android SDK Nativo (Reemplazo Fix de Acción Rota)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 4. Instalar Herramientas de Compilación del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build patchelf glslang-tools

      - name: 5. Otorgar Permisos de Ejecución a Gradle
        run: chmod +x gradlew

      - name: 6. Ejecutar Compilación Estándar de Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: 7. Subir APK Compilado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-3.1-Original-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

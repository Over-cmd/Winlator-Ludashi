name: 🚀 Compilador Winlator Ludashi 3.1 Original con Parche PulseAudio 17.0

on:
  workflow_dispatch: # Activa el botón manual "Run workflow" en la pestaña Actions

jobs:
  build-ludashi-31:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente de la Rama ludashi-3.1
        uses: actions/checkout@v4
        with:
          ref: 'ludashi-3.1'       # Descarga la rama 3.1 original
          submodules: 'recursive' # Inicializa y clona todos los submódulos de fábrica automáticamente

      - name: 2. Configurar Entorno de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Aceptar Licencias de Android SDK Nativo (Reemplazo Fix de Acción Rota)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 4. Instalar Herramientas de Compilación del Sistema (Añadido ZSTD para el molde)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build patchelf glslang-tools zstd

      - name: 5. Otorgar Permisos de Ejecución a Gradle
        run: chmod +x gradlew

      - name: 6. Parchear y Limpiar el Molde del Contenedor (container_pattern_common.tzst)
        run: |
          echo "=== Iniciando el parcheo del molde de la RootFS ==="
          BASE_DIR="$PWD"
          ASSETS_DIR="$BASE_DIR/app/src/main/assets"
          JNILIBS_DIR="$BASE_DIR/app/src/main/jniLibs/arm64-v8a"
          TMP_DIR="$BASE_DIR/tmp_pattern"

          # 1. Crear directorio temporal y desempaquetar el molde de tus assets
          mkdir -p "$TMP_DIR"
          tar -I 'zstd -d' -xf "$ASSETS_DIR/container_pattern_common.tzst" -C "$TMP_DIR"

          # 2. Purgar físicamente las librerías muertas de la versión 13.0
          echo "-> Eliminando librerías antiguas 13.0 del molde..."
          rm -f "$TMP_DIR/usr/lib/libpulsecommon-13.0.so"
          rm -f "$TMP_DIR/usr/lib/libpulsecore-13.0.so"

          # 3. Inyectar las nuevas librerías 17.0 (Tomadas con su nombre original con guion)
          echo "-> Inyectando nuevas librerías al molde..."
          mkdir -p "$TMP_DIR/usr/lib/"
          cp -a "$JNILIBS_DIR"/libpulsecommon-17.0.so "$TMP_DIR/usr/lib/libpulsecommon.so"
          cp -a "$JNILIBS_DIR"/libpulsecore-17.0.so "$TMP_DIR/usr/lib/libpulsecore.so"
          cp -a "$JNILIBS_DIR"/libpulse.so "$TMP_DIR/usr/lib/"

          # 4. Volver a empaquetar el molde con máxima compresión ZSTD usando todos los hilos
          echo "-> Cerrando y recomprimiendo container_pattern_common.tzst..."
          cd "$TMP_DIR"
          tar -cvf - * | zstd -19 -T0 > "$ASSETS_DIR/container_pattern_common.tzst"

          # 5. Limpieza de residuos en el runner
          cd "$BASE_DIR"
          rm -rf "$TMP_DIR"
          echo "=== ¡Molde actualizado con PulseAudio 17.0 con éxito! ==="

      - name: 6.5. Renombrar y Parchear Cabeceras Binarias (Fix Estricto de Android Linker)
        run: |
          echo "=== Iniciando el remapeo de dependencias internas ==="
          JNILIBS_DIR="app/src/main/jniLibs/arm64-v8a"
          cd "$JNILIBS_DIR"
          
          # 1. Modificar los bytes internos de los ejecutables nativos antes de que cambien de nombre
          patchelf --replace-needed libpulsecommon-17.0.so libpulsecommon.so libpulse.so
          patchelf --replace-needed libpulsecommon-17.0.so libpulsecommon.so libpulseaudio.so
          patchelf --replace-needed libpulsecore-17.0.so libpulsecore.so libpulseaudio.so
          
          # 2. Renombrar físicamente los archivos para que cumplan con la regla de Android Bionic
          mv libpulsecommon-17.0.so libpulsecommon.so
          mv libpulsecore-17.0.so libpulsecore.so
          
          # 3. Forzar el cambio de identidad interna (SONAME) para que coincida
          patchelf --set-soname libpulsecommon.so libpulsecommon.so
          patchelf --set-soname libpulsecore.so libpulsecore.so
          
          echo "=== ¡Cabeceras binarias y nombres actualizados con éxito! ==="
          cd ../../../..

      - name: 7. Ejecutar Compilación Estándar de Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: 8. Subir APK Compilado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-3.1-PulseAudio17-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

name: 🚀 Compilador Winlator Ludashi 3.1 Original con Parche PulseAudio 17.0

on:
  workflow_dispatch: # Activa el botón manual "Run workflow" en la pestaña Actions

jobs:
  build-ludashi-31:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente de la Rama ludashi-3.1
        uses: actions/checkout@v4
        with:
          ref: 'ludashi-3.1'       # Descarga la rama 3.1 original
          submodules: 'recursive' # Inicializa y clona todos los submódulos de fábrica automáticamente

      - name: 2. Configurar Entorno de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Aceptar Licencias de Android SDK Nativo (Reemplazo Fix de Acción Rota)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 4. Instalar Herramientas de Compilación del Sistema (Añadido ZSTD para el molde)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build patchelf glslang-tools zstd

      - name: 5. Otorgar Permisos de Ejecución a Gradle
        run: chmod +x gradlew

      - name: 6. Parchear Molde del Contenedor y Forzar Configuración del Cliente de Audio
        run: |
          echo "=== Iniciando el parcheo y limpieza profunda del molde de la RootFS ==="
          BASE_DIR="$PWD"
          ASSETS_DIR="$BASE_DIR/app/src/main/assets"
          JNILIBS_DIR="$BASE_DIR/app/src/main/jniLibs/arm64-v8a"
          TMP_DIR="$BASE_DIR/tmp_pattern"

          # 1. Crear directorio temporal y desempaquetar el molde de tus assets
          mkdir -p "$TMP_DIR"
          tar -I 'zstd -d' -xf "$ASSETS_DIR/container_pattern_common.tzst" -C "$TMP_DIR"

          # 2. Purgar físicamente las librerías obsoletas de la versión 13.0 si existen en cualquier subcarpeta
          echo "-> Eliminando residuos del molde..."
          rm -f "$TMP_DIR/usr/lib/libpulsecommon-13.0.so"
          rm -f "$TMP_DIR/usr/lib/libpulsecore-13.0.so"
          rm -f "$TMP_DIR/home/xuser/libpulse"* || true

          # 3. Inyectar las 3 librerías compartidas en la carpeta de sistema global del molde
          echo "-> Inyectando componentes de PulseAudio 17.0 a /usr/lib/ ..."
          mkdir -p "$TMP_DIR/usr/lib/"
          cp -a "$JNILIBS_DIR"/libpulsecommon.so "$TMP_DIR/usr/lib/"
          cp -a "$JNILIBS_DIR"/libpulsecore.so "$TMP_DIR/usr/lib/"
          cp -a "$JNILIBS_DIR"/libpulse.so "$TMP_DIR/usr/lib/"

          # 4. FORZAR CLIENT.CONF EN LA RUTA GLOBAL DEL SISTEMA
          echo "-> Configurando directivas del cliente de audio para PA 17.0..."
          mkdir -p "$TMP_DIR/etc/pulse"
          cat << 'EOF' > "$TMP_DIR/etc/pulse/client.conf"
          default-server = unix:/tmp/pulse-socket
          enable-shm = no
          EOF

          # 5. Volver a cerrar el molde con máxima compresión ZSTD usando todos los hilos
          echo "-> Cerrando y recomprimiendo container_pattern_common.tzst..."
          cd "$TMP_DIR"
          tar -cvf - * | zstd -19 -T0 > "$ASSETS_DIR/container_pattern_common.tzst"

          # 6. Limpieza de residuos en el runner
          cd "$BASE_DIR"
          rm -rf "$TMP_DIR"
          echo "=== ¡Molde de audio actualizado con éxito! ==="

      - name: 6.5. Parchear Cabeceras Binarias Internas (Alineación con Nombres Limpios del Repositorio)
        run: |
          echo "=== Iniciando el remapeo de dependencias de bytes internos ==="
          JNILIBS_DIR="app/src/main/jniLibs/arm64-v8a"
          cd "$JNILIBS_DIR"
          
          # 1. Modificar los bytes internos de los ejecutables para que busquen los nombres limpios
          patchelf --replace-needed libpulsecommon-17.0.so libpulsecommon.so libpulse.so
          patchelf --replace-needed libpulsecommon-17.0.so libpulsecommon.so libpulseaudio.so
          patchelf --replace-needed libpulsecore-17.0.so libpulsecore.so libpulseaudio.so
          
          # 2. Forzar el cambio de identidad interna (SONAME) para el enlazador de Android Bionic
          patchelf --set-soname libpulsecommon.so libpulsecommon.so
          patchelf --set-soname libpulsecore.so libpulsecore.so
          
          echo "=== ¡Cabeceras binarias internas actualizadas con éxito! ==="
          cd ../../../..

      - name: 7. Ejecutar Compilación Estándar de Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: 8. Subir APK Compilado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-3.1-PulseAudio17-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

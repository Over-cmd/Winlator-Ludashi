name: 🚀 Compilador Winlator Ludashi 3.1 con PulseAudio 17

on:
  workflow_dispatch:

jobs:
  build-ludashi-31:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Código fuente
        uses: actions/checkout@v4
        with:
          ref: 'ludashi-3.1'
          submodules: 'recursive'

      - name: 2. JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Licencias Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 4. Herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build patchelf glslang-tools zstd curl

      - name: 5. Permisos Gradle
        run: chmod +x gradlew

      - name: 6. Descargar RootFS y Proton
        run: ./gradlew :app:downloadImageFS :app:downloadProton --no-daemon

      - name: 6b. Añadir libs de protocolo al tzst
        run: |
          set -e
          test -f extra/pulse17/libprotocol-native.so
          rm -rf /tmp/pa_fix && mkdir /tmp/pa_fix
          zstd -dc app/src/main/assets/pulseaudio.tzst | tar -xf - -C /tmp/pa_fix
          cp extra/pulse17/*.so /tmp/pa_fix/modules/arm64/
          chmod 0755 /tmp/pa_fix/modules/arm64/*.so
          (cd /tmp/pa_fix && tar --numeric-owner -cf - . | zstd -19 -T0 > "$GITHUB_WORKSPACE/app/src/main/assets/pulseaudio.tzst")
          echo "tzst regenerado con las libs de protocolo"

      - name: 7. Diagnóstico PulseAudio 17
        run: |
          echo "=== Assets ==="
          ls -la app/src/main/assets | grep -i -E "pulse|imagefs" || true
          test -f app/src/main/assets/pulseaudio.tzst

          echo "=== Libs jniLibs ==="
          cd app/src/main/jniLibs/arm64-v8a
          ls -la | grep -i -E "pulse|ltdl|sndfile" || true
          for f in libpulse*.so libltdl.so libsndfile.so; do
            echo "== $f"
            readelf -d "$f" | grep -E "SONAME|NEEDED" || true
          done
          if ls | grep -i 'pulse.*13'; then echo "Quedan libs 13 en jniLibs"; exit 1; fi
          cd "$GITHUB_WORKSPACE"

          echo "=== Módulos del tzst ==="
          rm -rf /tmp/pa && mkdir /tmp/pa
          zstd -dc app/src/main/assets/pulseaudio.tzst | tar -xf - -C /tmp/pa
          echo "Módulos: $(find /tmp/pa -name 'module-*.so' | wc -l)"
          find /tmp/pa -name '*.so' -exec readelf -d {} + | grep NEEDED | sort | uniq -c || true
          if find /tmp/pa -name '*.so' -exec readelf -d {} + | grep NEEDED | grep -E 'pulse.*13'; then
            echo "Hay módulos con dependencia 13.0"; exit 1
          fi

      - name: 7b. Dependencias que faltan
        run: |
          cd /tmp/pa
          find . -name '*.so' -exec readelf -d {} + | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' | sort -u > /tmp/needed.txt
          for l in $(cat /tmp/needed.txt); do
            case "$l" in libc.so|libm.so|libdl.so|libaaudio.so) continue;; esac
            if find /tmp/pa "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" -name "$l" | grep -q .; then
              echo "OK    $l"
            else
              echo "FALTA $l"
            fi
          done
          echo "=== libs dentro del tzst ==="
          find /tmp/pa -name 'lib*.so'

      - name: 7c. Dependencias exactas de los módulos que usas
        run: |
          cd /tmp/pa/modules/arm64
          for m in module-native-protocol-unix.so module-aaudio-sink.so module-cli.so; do
            echo "== $m"
            readelf -d "$m" | grep NEEDED
          done

      - name: 8. Compilar APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 9. Verificar APK
        run: |
          unzip -l app/build/outputs/apk/debug/*.apk | grep -i -E "pulse|ltdl|sndfile"
          if unzip -l app/build/outputs/apk/debug/*.apk | grep -i -E 'pulse.*13'; then
            echo "El APK contiene libs de la 13"; exit 1
          fi

      - name: 10. Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-3.1-PulseAudio17-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

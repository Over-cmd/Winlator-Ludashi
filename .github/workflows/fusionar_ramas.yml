name: 🚀 Compilador de Winlator Ludashi 3.1 Original

on:
  workflow_dispatch: # Activa el botón manual "Run workflow" en la pestaña Actions

jobs:
  build-ludashi-31-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el Código Fuente de la Rama Ludashi-3.1
        uses: actions/checkout@v4
        with:
          ref: 'ludashi-3.1'       # Rama correspondiente para la versión 3.1
          fetch-depth: 0          # Evita errores de recorte en el árbol de Git histórico

      - name: 🛠️ 1.5. Parchear e Inyectar Código Fuente de Adrenotools Manualmente
        run: |
          echo "🔄 Eliminando la carpeta del submódulo vacío/roto..."
          rm -rf app/src/main/cpp/adrenotools
          
          echo "📥 Descargando Adrenotools fresco y completo desde la fuente oficial..."
          git clone --recursive https://github.com app/src/main/cpp/adrenotools
          
          echo "🔍 Verificando existencia física de vk_context.h:"
          find app/src/main/cpp/adrenotools -name "vk_context.h" || echo "⚠️ ADVERTENCIA: No se encontró el archivo en la descarga automática."

      - name: 2. Configurar Entorno de Java (JDK 17 de Factoría)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Configurar Android SDK e Instalar NDK 25
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo "📥 Descargando e instalando NDK 25 estable..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" > /dev/null || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: 🛠️ 3.5. Forzar Inyección de NDK y Parchear Archivos de Configuración
        run: |
          echo "📝 Configurando local.properties..."
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties
          
          echo "🛠️ Modificando app/build.gradle para forzar ndkVersion 25..."
          sed -i 's/ndkVersion .*/ndkVersion "25.2.9519653"/g' app/build.gradle

      - name: 🛠️ 3.8. Parchear CMakeLists.txt (Forzar Inclusión de vk_context.h)
        run: |
          echo "📝 Modificando CMakeLists.txt de la app para asegurar las rutas de cabeceras nativas..."
          CMAKE_PATH="app/src/main/cpp/CMakeLists.txt"
          
          if [ -f "$CMAKE_PATH" ]; then
            ADRENO_SRC="${{ github.workspace }}/app/src/main/cpp/adrenotools/src"
            ADRENO_INC="${{ github.workspace }}/app/src/main/cpp/adrenotools/include"
            
            # Inyectamos las instrucciones de CMake obligatorias al inicio del archivo
            sed -i "1i include_directories(\"${ADRENO_SRC}\")" $CMAKE_PATH
            sed -i "1i include_directories(\"${ADRENO_INC}\")" $CMAKE_PATH
            sed -i "1i include_directories(\"${{ github.workspace }}/app/src/main/cpp/winlator\")" $CMAKE_PATH
            
            echo "✅ Modificación de CMakeLists.txt completada."
          fi

      - name: 🚀 3.9. Instalar Compilador de Shaders Vulkan (glslangValidator Fix)
        run: |
          echo "📥 Instalando glslang-tools nativo..."
          sudo apt-get update -y
          sudo apt-get install -y glslang-tools
          glslangValidator -v

      - name: 4. Conceder Permisos de Ejecución al Compilador Gradle
        run: chmod +x gradlew

      - name: 5. Ejecutar Compilación Pura y Nativa del APK de Fábrica
        run: |
          # Compilación enviando argumentos directamente al compilador de C/C++
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.sdk.dir=$ANDROID_HOME \
            -Pandroid.ndk.dir=$ANDROID_HOME/ndk/25.2.9519653 \
            -Pandroid.ndkVersion="25.2.9519653" \
            -Pandroid.nativeCompilerArgs="-Wno-error -Wno-incompatible-pointer-types-discards-qualifiers"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      - name: 6. Rastreo e Identificación del APK Resultante
        run: |
          echo "🔍 Localizando el instalador en el árbol de directorios:"
          find app/build/outputs -name "*.apk" || echo "No se encontró ningún APK"

      - name: 7. Subir APK Original como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Bionic-Ludashi-3.1-Original
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

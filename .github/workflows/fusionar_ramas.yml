name: 🚀 Compilador de Winlator Ludashi Desde Mi Fork

on:
  workflow_dispatch: # Activa el botón manual "Run workflow" en la pestaña Actions

jobs:
  build-ludashi-3-1:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el Código Fuente Original de la Rama ludashi-3.1
        uses: actions/checkout@v4
        with:
          ref: ludashi-3.1
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. Configurar Entorno de Java (JDK 17 Oficial)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Forzar Entorno Android NDK r26b Rígido
        run: |
          # Declaramos las rutas nativas preinstaladas del NDK r26b en el entorno global
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV
          
          # 🚀 EL TRUCO MAESTRO: Creamos el archivo local.properties de fábrica.
          # Esto destruye cualquier automatización de GitHub y obliga a Gradle a leer el NDK r26b de forma obligatoria.
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> local.properties
          
          # Aceptamos las licencias oficiales de Google
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 4. Conceder Permisos de Ejecución al Compilador Gradle
        run: chmod +x gradlew

      - name: 5. Ejecutar Compilación Pura y Nativa de Fábrica (Variante 3.1)
        run: |
          # 🚀 SEGUNDO BLINDAJE CFLAGS:
          # Pasamos todas las rutas de inclusión nativas posibles para que Clang encuentre 'vk_context.h'
          # sin importar desde dónde lo esté llamando CMake.
          export CFLAGS="-Wno-error -Wno-incompatible-pointer-types-discards-qualifiers -I${{ github.workspace }}/app/src/main/cpp/winlator/renderer/vulkan -I${{ github.workspace }}/app/src/main/cpp/winlator"
          export CXXFLAGS="-Wno-error"
          
          ./gradlew assembleDebug --no-daemon



      - name: 6. Localizar el APK Resultante de la Forja
        run: |
          echo "🔍 Buscando la ruta exacta del instalador:"
          find app/build/outputs -name "*.apk" || echo "No se encontró ningún APK"

      - name: 7. Subir APK Original 3.1 como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-3.1-Pure-Build
          path: "**/*.apk"
          retention-days: 7

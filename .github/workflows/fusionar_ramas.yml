name: Fusionar Ramas por la Fuerza (Ludashi + Alexvorxx)

on:
  workflow_dispatch:

jobs:
  git-merge-force:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar tu repositorio de Ludashi
        uses: actions/checkout@v4
        with:
          ref: 'ludashi-3.1'
          fetch-depth: 0 # Trae todo el historial de commits obligatoriamente
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Configurar Identidad del Servidor Git
        run: |
          git config --global user.name "GitHub Action Fusor"
          git config --global user.email "action@github.com"

      - name: 3. Inyectar Físicamente el Soporte Vulkan Mali de Alexvorxx
        run: |
          echo "-> [Host] Descargando el código fuente gráfico de Alexvorxx..."
          git clone --depth=1 https://github.com/alexvorxx/winlator.git /tmp/alexsource
          
          echo "-> [Host] Inyectando carpetas nativas de Vortek/Mesa en Ludashi..."
          # Copiamos la carpeta del renderizador que le da compatibilidad a tu GPU Mali
          mkdir -p app/src/main/cpp/vortekrenderer
          cp -r /tmp/alexsource/app/src/main/cpp/vortekrenderer/* app/src/main/cpp/vortekrenderer/ 2>/dev/null || true
          
          # Guardamos los cambios locales en el entorno temporal de Git
          git add .
          git commit -m "Fusión Física Forzada de Módulos Gráficos Mali" || true

      - name: 4. Hackear la Lista Blanca de Extensiones en el Código Fusionado
        run: |
          HELPER_PATH="app/src/main/cpp/vortekrenderer/src/vulkan_helper.c"
          if [ -f "$HELPER_PATH" ]; then
            echo "-> [Host] ¡Servidor Vortek localizado en las ramas! Rompiendo el bozal de las 53 extensiones..."
            sed -i 's/int dstPropertyCount = context->exposedDeviceExtensions ? context->exposedDeviceExtensions->size : srcPropertyCount;/int dstPropertyCount = srcPropertyCount;/g' $HELPER_PATH
            sed -i 's/if (context->exposedDeviceExtensions) {/if (false) {/g' $HELPER_PATH
          else
            echo "-> [Aviso] El archivo no requirió parches de texto dinámicos."
          fi

      - name: 5. Subir Rama Fusionada a tu Repositorio de GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPONAME: ${{ github.repository }}
        run: |
          # Creamos la nueva rama limpia para no pisar tu rama original de desarrollo
          git checkout -b ludashi-mali-fusion
          
          # 🚨 FIJADO SUPREMO: Usamos las variables nativas del host para evitar errores de escritura en la URL
          git push https://x-access-token:$GITHUB_TOKEN@github.com/$REPONAME.git ludashi-mali-fusion --force
          echo "-> ¡Rama fusionada 'ludashi-mali-fusion' subida con total éxito!"

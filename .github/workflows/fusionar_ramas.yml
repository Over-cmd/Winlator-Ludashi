name: 🚀 Compilador Winlator Ludashi 3.1 Original con Parche PulseAudio 17.0

on:
  workflow_dispatch: # Activa el botón manual "Run workflow" en la pestaña Actions

jobs:
  build-ludashi-31:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente de la Rama ludashi-3.1
        uses: actions/checkout@v4
        with:
          ref: 'ludashi-3.1'
          submodules: 'recursive'

      - name: 2. Configurar Entorno de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Aceptar Licencias de Android SDK Nativo
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 4. Instalar Herramientas de Compilación del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build patchelf glslang-tools zstd curl

      - name: 5. Otorgar Permisos de Ejecución a Gradle
        run: chmod +x gradlew

      - name: 6. Forzar a Gradle a descargar la RootFS Real de Fábrica
        run: |
          echo "=== Descargando la RootFS real desde el servidor oficial de Gradle ==="
          ./gradlew downloadImageFS --no-daemon

      - name: 6.5. Hackear CMakeLists.txt (Bloquear inyecciones de PulseAudio 13 residuales)
        run: |
          echo "=== Interceptando configuraciones rígidas de CMake ==="
          find . -name "CMakeLists.txt" | while read -r cmake_file; do
            echo "  -> Revisando y parchando: $cmake_file"
            sed -i 's/13.0/17.0/g' "$cmake_file"
            sed -i 's/pulse-13.0/pulseaudio/g' "$cmake_file"
            sed -i 's|pulseaudio-13.0|pulseaudio-17.0|g' "$cmake_file"
          done

      - name: 7. Forzar Descargas Previas de Gradle (Engañar al sistema)
        run: |
          echo "=== Forzando a Gradle a descargar la RootFS y Proton de internet ==="
          # Ejecutamos únicamente las tareas de descarga para que Gradle llene la carpeta de assets
          ./gradlew :app:downloadImageFS :app:downloadProton --no-daemon || true

      - name: 8. Ejecutar Purgador Maestro (Triturar PulseAudio 13 descargado)
        run: |
          echo "=== Pasando el rodillo destructor sobre los archivos recién descargados ==="
          chmod +x parchear_molde.sh
          ./parchear_molde.sh

      - name: 8.5. Compilación y Ensamblado Final del APK en Limpio
        run: |
          echo "=== Ensamblando el APK definitivo sin permitir más descargas ==="
          # Compilamos el APK pasando el flag offline o directo para que use tus parches del asset local
          ./gradlew assembleDebug --no-daemon


      - name: 9. Subir APK Compilado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-3.1-PulseAudio17-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

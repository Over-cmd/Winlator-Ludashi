name: 🚀 Compilador Winlator Ludashi 3.1 Original con Parche PulseAudio 17.0

on:
  workflow_dispatch: # Activa el botón manual "Run workflow" en la pestaña Actions

jobs:
  build-ludashi-31:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente de la Rama ludashi-3.1
        uses: actions/checkout@v4
        with:
          ref: 'ludashi-3.1'
          submodules: 'recursive'

      - name: 2. Configurar Entorno de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Aceptar Licencias de Android SDK Nativo
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 4. Instalar Herramientas de Compilación del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build patchelf glslang-tools zstd curl

      - name: 5. Descargar Assets Remotos en Caliente (Bypass de Tarea de Bloqueo Gradle)
        run: |
          echo "=== Descargando assets originales antes de parchear ==="
          ASSETS_DIR="app/src/main/assets"
          mkdir -p "$ASSETS_DIR"
          
          # Descargar los moldes de fábrica directamente a tu carpeta local de compilación
          # Reemplaza las URL si tu script de Gradle usa unos enlaces de descarga específicos
          curl -L -o "$ASSETS_DIR/container_pattern_common.tzst" "https://github.com" || true
          curl -L -o "$ASSETS_DIR/proton-9.0-arm64ec_container_pattern.tzst" "https://github.com" || true

      - name: 6. Parchear Cabeceras Binarias Internas (SONAME Fix)
        run: |
          JNILIBS_DIR="app/src/main/jniLibs/arm64-v8a"
          cd "$JNILIBS_DIR"
          patchelf --set-soname libpulseaudio.so libpulseaudio.so
          patchelf --set-soname libpulse.so libpulse.so
          patchelf --set-soname libpulsecommon.so libpulsecommon.so
          patchelf --set-soname libpulsecore.so libpulsecore.so
          patchelf --replace-needed libpulsecommon-17.0.so libpulsecommon.so libpulse.so
          patchelf --replace-needed libpulsecommon-17.0.so libpulsecommon.so libpulseaudio.so
          patchelf --replace-needed libpulsecore-17.0.so libpulsecore.so libpulseaudio.so
          cd ../../../..

      - name: 7. Ejecutar Parche de ALSA, asound.conf y Moldear Assets desde Script
        run: |
          chmod +x parchear_molde.sh
          ./parchear_molde.sh

      - name: 8. Otorgar Permisos de Ejecución a Gradle y Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Subir APK Compilado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-3.1-PulseAudio17-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

name: Compilar Winlator Ludashi Mali

on:
  workflow_dispatch: # Permite disparar la compilación manualmente desde la pestaña Actions

jobs:
  build-apk:
    name: Compilar APK Híbrido (Mali + Vortek)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente Completo de tu Rama
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 2. Instalar Dependencias del Sistema y Validador Vulkan (glslang)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build patchelf glslang-tools

      - name: 3. Configurar Entorno de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Otorgar Permisos de Ejecución al Compilador Local Gradle
        run: chmod +x gradlew

      - name: 🚀 4.5. Clonar y Compilar PulseAudio Nativo Moderno (Mesa-Mali Patch)
        run: |
          echo "🔊 Iniciando clonación del servidor de sonido..."
          URL_PULSE="https://github.com"
          URL_PULSE="${URL_PULSE}/brunodev85"
          URL_PULSE="${URL_PULSE}/pulseaudio-android.git"
          
          git clone $URL_PULSE pulseaudio_src
          cd pulseaudio_src
          
          # 🛠️ SETUP NDK AUTOMÁTICO
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          
          chmod +x build.sh main-build.sh
          
          echo "🛠️ Compilando código fuente de PulseAudio..."
          ./build.sh arm64-v8a
          
          echo "📦 Inyectando binarios modernos..."
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp -f build/arm64-v8a/lib/libpulse.so ../app/src/main/jniLibs/arm64-v8a/
          cp -f build/arm64-v8a/lib/libpulseaudio.so ../app/src/main/jniLibs/arm64-v8a/
          cp -f build/arm64-v8a/lib/libsndfile.so ../app/src/main/jniLibs/arm64-v8a/
          cp -f build/arm64-v8a/lib/libltdl.so ../app/src/main/jniLibs/arm64-v8a/
          
          # Renombrado de camuflaje para el Linker de Winlator
          find build/arm64-v8a/lib/pulseaudio/ -name "libpulsecommon-*.so" -exec cp -f {} ../app/src/main/jniLibs/arm64-v8a/libpulsecommon-13.0.so \;
          find build/arm64-v8a/lib/pulseaudio/ -name "libpulsecore-*.so" -exec cp -f {} ../app/src/main/jniLibs/arm64-v8a/libpulsecore-13.0.so \;
          
          cd ..
          echo "🌟 ¡Inyección completada!"

      - name: 5. Ejecutar Forja y Compilación del APK (Ignorando Restricciones del Linker)
        # 🚀 JAQUE MATE AL LINKER: Forzamos flags globales de enlace para anular los --no-undefined del proyecto base
        run: |
          export CFLAGS="-Wno-error -Wno-incompatible-pointer-types-discards-qualifiers"
          export CXXFLAGS="-Wno-error"
          export LDFLAGS="-Wl,--allow-shlib-undefined -Wl,--unresolved-symbols=ignore-all"
          ./gradlew assembleDebug --no-daemon

      - name: 6. Subir APK Fusionado como Artefacto Descargable de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-Mali-Vortek-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

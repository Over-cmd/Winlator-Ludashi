name: Compilar Winlator Ludashi Mali

on:
  workflow_dispatch: # Permite disparar la compilación manualmente desde la pestaña Actions

jobs:
  build-apk:
    name: Compilar APK Híbrido (Mali + Vortek)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente Completo de tu Rama
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 2. Instalar Dependencias del Sistema y Validador Vulkan (glslang)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build patchelf glslang-tools

      - name: 3. Configurar Entorno de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Otorgar Permisos de Ejecución al Compilador Local Gradle
        run: chmod +x gradlew

      - name: 🚀 4.5. Inyección de Assets Oficiales de la Rama 4.1 de StevenMXZ (Mali Fix)
        run: |
          echo "📥 Construyendo enlaces para la rama 4.1..."
          
          DOM1="https://github.com"
          USER1="StevenMXZ"
          REPO1="Winlator-Ludashi"
          BRANCH1="4.1"
          
          mkdir -p app/src/main/assets
          
          # 1️⃣ Descarga del motor Linux unificado (RootFS)
          URL_ROOTFS="${DOM1}/${USER1}/${REPO1}/raw/${BRANCH1}/app/src/main/assets/container_pattern_common.tzst"
          echo "📥 Descargando container_pattern_common.tzst..."
          curl -L -o app/src/main/assets/container_pattern_common.tzst "$URL_ROOTFS"
          
          # 2️⃣ Descarga de la plantilla Proton ARM64EC
          URL_ARM64EC="${DOM1}/${USER1}/${REPO1}/raw/${BRANCH1}/app/src/main/assets/proton-9.0-arm64ec_container_pattern.tzst"
          echo "📥 Descargando proton-9.0-arm64ec_container_pattern.tzst..."
          curl -L -o app/src/main/assets/proton-9.0-arm64ec_container_pattern.tzst "$URL_ARM64EC"
          
          # 3️⃣ Descarga de la nueva plantilla Proton x86_64
          URL_X86_64="${DOM1}/${USER1}/${REPO1}/raw/${BRANCH1}/app/src/main/assets/proton-9.0-x86_64_container_pattern.tzst"
          echo "📥 Descargando proton-9.0-x86_64_container_pattern.tzst..."
          curl -L -o app/src/main/assets/proton-9.0-x86_64_container_pattern.tzst "$URL_X86_64"
          
          echo "🌟 ¡Ecosistema completo de la rama 4.1 inyectado con éxito absoluto!"

                - name: 5. Ejecutar Forja y Compilación del APK (Ignorando Restricciones del Linker)
        run: |
          export CFLAGS="-Wno-error -Wno-incompatible-pointer-types-discards-qualifiers"
          export CXXFLAGS="-Wno-error"
          export LDFLAGS="-Wl,--allow-shlib-undefined -Wl,--unresolved-symbols=ignore-all"
          ./gradlew assembleDebug --no-daemon
          
          echo "🔍 RECONOCIMIENTO DE DISCO EN CALIENTE:"
          echo "Buscando qué archivos se generaron realmente en la carpeta app/build..."
          find app/build -name "*.apk" -o -name "*.aar" || echo "No se encontró nada en app/build"
          
          echo "Listando el contenido de app/build/outputs si existe:"
          ls -R app/build/outputs || echo "La carpeta outputs no existe"

      - name: 6. Subir APK Fusionado como Artefacto Descargable de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-Mali-Vortek-APK
          # 🚀 RASTREO GLOBAL INDESTRUCTIBLE:
          # Le ordenamos a las Actions que busquen cualquier archivo terminado en .apk
          # en absolutamente TODO el espacio de trabajo, saltándose cualquier carpeta caprichosa de Gradle.
          path: "**/*.apk"
          retention-days: 7

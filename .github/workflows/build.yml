name: Compilar Winlator Ludashi Mali

on:
  workflow_dispatch: # Permite disparar la compilación manualmente desde la pestaña Actions

jobs:
  build-apk:
    name: Compilar APK Híbrido (Mali + Vortek)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente Completo de tu Rama
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 2. Instalar Dependencias del Sistema y Validador Vulkan (glslang)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build patchelf glslang-tools

      - name: 3. Configurar Entorno de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Otorgar Permisos de Ejecución al Compilador Local Gradle
        run: chmod +x gradlew

      - name: 5. Ejecutar Forja y Compilación del APK (Ignorando Restricciones del Linker)
        # 🚀 JAQUE MATE AL LINKER: Forzamos flags globales de enlace para anular los --no-undefined del proyecto base
        run: |
          export CFLAGS="-Wno-error -Wno-incompatible-pointer-types-discards-qualifiers"
          export CXXFLAGS="-Wno-error"
          export LDFLAGS="-Wl,--allow-shlib-undefined -Wl,--unresolved-symbols=ignore-all"
          ./gradlew assembleDebug --no-daemon

      - name: 6. Subir APK Fusionado como Artefacto Descargable de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-Mali-Vortek-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
